[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-pc-scanner"
version = "0.5.0"
description = "Local, restricted OSS security scanner bridge for AI agents"
requires-python = ">=3.11"
readme = "README.md"
# The project's own code is MIT; the other files keep third-party permissions and notices.
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/**/*"]

[project.optional-dependencies]
# anyio is imported directly by the MCP server; mcp itself requires anyio>=4.5.
# cryptography arrives through mcp -> pyjwt[crypto]; 50 fixes CVE-2026-69247/69248/69249.
# Intel Macs are exempt: no prebuilt wheel exists for them from 49 on (see docs/backlog.md).
agent = ["mcp>=1.20,<2", "anyio>=4.5,<5",
         "cryptography>=50; sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[project.scripts]
pc-scanner = "pc_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["pc_scanner*"]
