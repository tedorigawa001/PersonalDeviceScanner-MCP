[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-pc-scanner"
version = "0.1.0"
description = "Local, restricted OSS security scanner bridge for AI agents"
requires-python = ">=3.11"
readme = "README.md"
# Own-code license is proposed, not granted. See docs/license-recommendation.md.
# These files retain third-party permissions; they do not license our own code.
license-files = ["THIRD_PARTY_NOTICES.md", "third_party/licenses/**/*"]

[project.optional-dependencies]
# anyio is imported directly by the MCP server; mcp itself requires anyio>=4.5.
agent = ["mcp>=1.20,<2", "anyio>=4.5,<5"]

[project.scripts]
pc-scanner = "pc_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["pc_scanner*"]
