name: Compliance profiles

# Generates the lock, SBOM and third-party notices on each OS. Dependencies differ
# per platform (pywin32 on Windows, for example) and the generator reads the installed
# environment, so each profile must be built on its own OS. Versions follow the
# reference lock at the repository root. Download the artifacts into profiles/.
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Interpreter for the new snapshot (3.14 refreshes existing profiles)"
        type: choice
        options: ["3.15", "3.14"]
        default: "3.14"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: Profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the agent dependencies at the reference lock's versions
        run: |
          python -m pip install --upgrade pip
          python - <<'EOF'
          import tomllib
          from pip._vendor.packaging.requirements import Requirement
          from pip._vendor.packaging.utils import canonicalize_name
          agent = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["agent"]
          with open("agent-requirements.txt", "w") as f:
              f.write("\n".join(agent) + "\n")
          # Keep the reference lock's versions, except where the project's own requirements
          # for this platform exclude them (a security floor such as cryptography>=50).
          own = [r for r in map(Requirement, agent) if r.marker is None or r.marker.evaluate()]
          with open("requirements-agent.lock") as lock, open("constraints.txt", "w") as f:
              for line in lock:
                  if not line.strip() or line.startswith("#"):
                      continue
                  pin = Requirement(line.split()[0])
                  version = next(iter(pin.specifier)).version
                  if all(canonicalize_name(r.name) != canonicalize_name(pin.name) or r.specifier.contains(version)
                         for r in own):
                      f.write(f"{pin}\n")
                  else:
                      print(f"::notice::{pin} conflicts with this project's requirements here; resolving it afresh")
          EOF
          python -m pip install --only-binary=:all: -c constraints.txt -r agent-requirements.txt
          python -m pip check
      - name: Name the profile
        id: profile
        run: |
          python -c "import platform, sys; print(f'name={platform.system().lower()}-{platform.machine().lower()}-cp{sys.version_info[0]}{sys.version_info[1]}')" >> "$GITHUB_OUTPUT"
      - name: Download reference wheels
        run: |
          python -m pip freeze > installed.txt
          python -m pip download --no-deps --only-binary=:all: -r installed.txt --dest .compliance-wheels
      - name: Generate lock, SBOM and notices
        id: generate
        continue-on-error: true
        env:
          PROFILE: ${{ steps.profile.outputs.name }}
        run: python scripts/generate_compliance.py --output "profiles/$PROFILE" --wheels-dir .compliance-wheels
      - name: Fetch the CycloneDX 1.6 schemas
        run: |
          base=https://raw.githubusercontent.com/CycloneDX/specification/55343ba19dee1785acf1ce9191540d5fd7b590db/schema
          mkdir -p .compliance-schema
          for name in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -fsSL "$base/$name" -o ".compliance-schema/$name"
          done
      - name: Validate schema, dependency graph, lock and evidence
        id: validate
        continue-on-error: true
        env:
          PROFILE: ${{ steps.profile.outputs.name }}
        run: python scripts/validate_compliance.py --root "profiles/$PROFILE" --schema-dir .compliance-schema
      # Uploaded even when a license is unresolved, so a person can review it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: profile-${{ steps.profile.outputs.name }}
          path: profiles/${{ steps.profile.outputs.name }}
          if-no-files-found: error
      - name: Fail when generation or validation failed
        if: steps.generate.outcome != 'success' || steps.validate.outcome != 'success'
        run: |
          echo "::error::Generation or validation failed; unresolved licenses need a person's decision"
          exit 1
