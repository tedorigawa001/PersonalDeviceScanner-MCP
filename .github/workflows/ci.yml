name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash stops on the first failing command on every OS, including Windows.
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported and newest Python.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the agent extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[agent]"
          python -m pip check
      - name: Require the MCP SDK so MCP tests are not skipped
        run: python -c "import mcp"
      - name: Verify ownership with real Windows security descriptors
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_windows_owner.py -v
      - name: Run tests
        run: python -m unittest discover -s tests -v

  npm:
    name: npm launcher (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 matches the bundled locks (hash-checked install); 3.11 takes the versions-only path.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Oldest supported Node.js (package.json "engines").
          node-version: "22"
      - name: Test the launcher, then pack, install and serve MCP from the package
        env:
          PC_SCANNER_NPM_E2E: "1"
          PC_SCANNER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node --test npm/test/launcher.test.js npm/test/roundtrip.test.js

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Verify notices and SBOM files in both distributions
        run: python scripts/verify_distribution.py dist
