# Copy to scanner.toml. Only the owner edits this file; do not let the AI edit it.
# Empty values disable integrations. Use absolute paths, not PATH lookup.
# Windows TOML paths: use single quotes, e.g. 'C:\Program Files\osquery\osqueryi.exe'
[local]
osquery_binary = ""
clamav_binary = ""
# Shared by the folder coverage check and the engine; clamscan reloads signatures on each run.
timeout_seconds = 600
max_output_bytes = 1048576
# ClamAV signatures older than this make scans partial; ClamAV itself warns after 7 days.
max_signature_age_days = 7

[history]
# A summary of each scan (what ran and how it ended; no file, app or package names) kept on this PC.
# Read it with `pc-scanner history`; the AI cannot read it. false stops recording.
enabled = true
# Absolute path; empty uses the per-user folder, e.g. ~/Library/Application Support/personal-device-scanner-mcp
# on macOS, ~/.local/state/personal-device-scanner-mcp on Linux, %LOCALAPPDATA%\personal-device-scanner-mcp on Windows.
file = ""
# Also keep each scan's full result (findings, warnings, data) for `pc-scanner dashboard`. Off by default:
# kept results hold file, app and package names, and anyone who can use this PC can read them.
details = false
# Size limit for kept results in MiB (1..1024); the oldest are removed first.
details_max_mb = 50

[updates]
# On each scan, compare the osquery, ClamAV and adb versions with their latest official releases and warn
# when one is older. Off by default: it contacts api.github.com and dl.google.com (nothing about this PC is
# sent). It never updates anything; what was found is kept for a day beside the history.
lookup = false

# Explicitly grant scan access. Example: downloads = '/Users/you/Downloads'
[scan_roots]

[wazuh]
# Existing Wazuh indexer, NOT the manager API on port 55000.
url = ""
# Numeric agent ID as shown by Wazuh, e.g. "001" ("1" is normalized to "001").
agent_id = ""
# Absolute path to the indexer's CA certificate (PEM); empty uses the system certificates.
ca_file = ""
# Optional: the agent's name in Wazuh if it is not this PC's host name. Results whose
# agent name does not match are reported as partial (they may belong to another device).
agent_name = ""
# Credentials are read from PC_SCANNER_WAZUH_USER and PC_SCANNER_WAZUH_PASSWORD.
# Grant this account read access only to the authorized agent's vulnerability data.

[wazuh.freshness]
# Optional Manager API observations; never certify vulnerability results as fresh.
enabled = false
manager_url = ""
ca_file = ""
max_keepalive_age_seconds = 300
max_os_record_age_seconds = 7200
# Separate credentials: PC_SCANNER_WAZUH_MANAGER_USER / PC_SCANNER_WAZUH_MANAGER_PASSWORD.
# Grant agent:read and syscollector:read only on this agent ID; native RBAC also permits
# other inventory and active-configuration reads for that same agent, not only OS records.

[android]
# Android SDK Platform-Tools adb (absolute path). Empty disables Android. Only USB-connected devices
# are inspected; turn USB debugging off on the device when the check is done.
adb_binary = ""
# Monitoring-app indicators: Echap stalkerware-indicators, generated/stalkerware.stix2 (CC-BY 4.0).
# Download and update them yourself; this tool never downloads them.
indicators_file = ""
# Indicators older than this, by the provider's generation time, make the check partial.
max_indicator_age_days = 30
# A security patch older than this is reported as outdated_patch.
max_patch_age_days = 90

# Explicitly allow devices: alias = adb serial (see `adb devices -l`). Your own devices only.
[android_devices]

[router]
# Home routers are checked WITHOUT contacting them: the model and firmware version you enter, and the settings you
# confirmed in the admin screen. true sends each router's CPE names (nothing else) to IPA's MyJVN API over HTTPS.
jvn_lookup = false
# CISA KEV catalog (CC0) you download yourself; this tool never downloads it.
kev_file = ""
# A KEV catalog older than this, by its release time, makes the check partial.
max_kev_age_days = 30
# Settings checked longer ago than this make the check partial.
max_check_age_days = 180

# Register your own routers: "alias = table". Find jvn_cpes with `pc-scanner router-products <maker> <keyword>`.
# Never write the router's password here. Leave out what you have not checked; it is reported as unchecked.
# [routers.home]
# maker = "buffalo"               # buffalo, nec, iodata, elecom, or the maker's name
# model = "WSR-3200AX4S"
# firmware = "1.42"
# jvn_cpes = ["cpe:/h:buffalo_inc:wsr-3200ax4s"]
# support = "supported"           # supported, ended or unknown (see the maker's end-of-support list)
# checked_on = 2026-10-17
# [routers.home.settings]
# auto_update = true
# admin_password_changed = true
# remote_admin = false
# vpn_server = false
# ddns = false
# upnp = false
# wps = false
# wifi_security = "wpa3"          # wpa3, wpa2-aes, wpa2-tkip, wep or open
# unknown_vpn_accounts = false
