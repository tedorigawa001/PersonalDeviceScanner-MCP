# Copy to scanner.toml. Only the owner edits this file; do not let the AI edit it.
# Empty values disable integrations. Use absolute paths, not PATH lookup.
# Windows TOML paths: use single quotes, e.g. 'C:\Program Files\osquery\osqueryi.exe'
[local]
osquery_binary = ""
clamav_binary = ""
# Shared by the folder coverage check and the engine; clamscan reloads signatures on each run.
timeout_seconds = 600
max_output_bytes = 1048576
# ClamAV signatures older than this make scans partial; ClamAV itself warns after 7 days.
max_signature_age_days = 7

# Explicitly grant scan access. Example: downloads = '/Users/you/Downloads'
[scan_roots]

[wazuh]
# Existing Wazuh indexer, NOT the manager API on port 55000.
url = ""
# Numeric agent ID as shown by Wazuh, e.g. "001" ("1" is normalized to "001").
agent_id = ""
# Absolute path to the indexer's CA certificate (PEM); empty uses the system certificates.
ca_file = ""
# Optional: the agent's name in Wazuh if it is not this PC's host name. Results whose
# agent name does not match are reported as partial (they may belong to another device).
agent_name = ""
# Credentials are read from PC_SCANNER_WAZUH_USER and PC_SCANNER_WAZUH_PASSWORD.
# Grant this account read access only to the authorized agent's vulnerability data.

[android]
# Android SDK Platform-Tools adb (absolute path). Empty disables Android. Only USB-connected devices
# are inspected; turn USB debugging off on the device when the check is done.
adb_binary = ""
# Monitoring-app indicators: Echap stalkerware-indicators, generated/stalkerware.stix2 (CC-BY 4.0).
# Download and update them yourself; this tool never downloads them.
indicators_file = ""
# Indicators older than this, by the provider's generation time, make the check partial.
max_indicator_age_days = 30
# A security patch older than this is reported as outdated_patch.
max_patch_age_days = 90

# Explicitly allow devices: alias = adb serial (see `adb devices -l`). Your own devices only.
[android_devices]
